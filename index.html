<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servo Control - Remote</title>
    <style>
        :root {
            --color-primary: #667eea;
            --color-secondary: #764ba2;
            --color-accent: #f5576c;
            --gradient-primary: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            --gradient-accent: linear-gradient(135deg, #f093fb 0%, var(--color-accent) 100%);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            --shadow-medium: 0 4px 15px rgba(102, 126, 234, 0.4);
            --shadow-light: 0 2px 5px rgba(0, 0, 0, 0.2);
            --radius-lg: 20px;
            --radius-md: 15px;
            --radius-sm: 10px;
            --thumb-size: 25px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--gradient-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-heavy);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .device-id {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .status-badge {
            text-align: center;
            padding: 8px 16px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .status-badge.connecting {
            background: #fff3cd;
            color: #856404;
        }
        .angle-display {
            background: var(--gradient-primary);
            color: white;
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
            margin-bottom: 30px;
            font-size: 48px;
            font-weight: bold;
            box-shadow: var(--shadow-medium);
        }
        .slider-container {
            margin-bottom: 30px;
        }
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: var(--thumb-size);
            height: var(--thumb-size);
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: var(--shadow-light);
        }
        .slider::-moz-range-thumb {
            width: var(--thumb-size);
            height: var(--thumb-size);
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: var(--shadow-light);
            border: none;
        }
        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-preset {
            background: var(--gradient-primary);
        }
        .btn-preset:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-center {
            background: var(--gradient-accent);
            grid-column: span 3;
        }
        .info {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 20px;
            background: #e7f3ff;
            color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Servo Control</h1>
        <div class="device-id" id="deviceId">Device: Loading...</div>
        <div class="status-badge connecting" id="statusBadge">Connecting...</div>
        
        <div class="angle-display" id="angleDisplay">0°</div>
        
        <div class="slider-container">
            <input type="range" min="-90" max="90" value="0" class="slider" id="angleSlider" disabled>
            <div class="range-labels">
                <span>-90°</span>
                <span>0°</span>
                <span>90°</span>
            </div>
        </div>
        
        <div class="preset-buttons">
            <button class="btn btn-preset" onclick="setAngle(-90)" disabled id="btn1">-90°</button>
            <button class="btn btn-preset" onclick="setAngle(-45)" disabled id="btn2">-45°</button>
            <button class="btn btn-preset" onclick="setAngle(0)" disabled id="btn3">0°</button>
            <button class="btn btn-preset" onclick="setAngle(45)" disabled id="btn4">45°</button>
            <button class="btn btn-preset" onclick="setAngle(90)" disabled id="btn5">90°</button>
            <button class="btn btn-center" onclick="setAngle(0)" disabled id="btn6">Center</button>
        </div>
        
        <div class="info">
            Control via Internet - No WiFi needed
        </div>
    </div>

    <!-- MQTT.js库 - 使用国内CDN加速 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
    
    <script>
        const slider = document.getElementById('angleSlider');
        const angleDisplay = document.getElementById('angleDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const deviceIdDiv = document.getElementById('deviceId');
        const buttons = document.querySelectorAll('.btn');
        
        let mqttClient = null;
        let deviceId = '';
        let mqttTopic = '';
        
        // --- Shared Utilities ---

        function updateStatus(text, state) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge ' + state;
        }

        function setControlsEnabled(enabled) {
            slider.disabled = !enabled;
            buttons.forEach(function(btn) { btn.disabled = !enabled; });
        }

        function updateAngleDisplay(angle) {
            angleDisplay.textContent = angle + '°';
            slider.value = angle;
        }

        function generateClientId(prefix) {
            return prefix + '_' + Date.now() + '_' + Math.random().toString(16).substr(2, 8);
        }

        // --- Initialization ---

        const urlParams = new URLSearchParams(window.location.search);
        deviceId = urlParams.get('id') || 'servo_demo';
        deviceIdDiv.textContent = 'Device: ' + deviceId;
        mqttTopic = 'smartservo/' + deviceId + '/control';
        
        // --- MQTT Connection ---

        function connectMQTT() {
            const mqttUrl = 'ws://47.103.142.124:9001';
            const clientId = generateClientId('web_' + deviceId);
            
            console.log('Connecting to MQTT:', mqttUrl);
            console.log('Topic:', mqttTopic);
            console.log('Client ID:', clientId);
            
            mqttClient = mqtt.connect(mqttUrl, {
                clientId: clientId,
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 1000,
            });
            
            mqttClient.on('connect', function() {
                console.log('MQTT Connected');
                updateStatus('Connected', 'connected');
                setControlsEnabled(true);
            });
            
            mqttClient.on('error', function(err) {
                console.error('MQTT Error:', err);
                updateStatus('Connection Error', 'disconnected');
            });
            
            mqttClient.on('offline', function() {
                console.log('MQTT Offline');
                updateStatus('Disconnected', 'disconnected');
                setControlsEnabled(false);
            });
            
            mqttClient.on('reconnect', function() {
                console.log('MQTT Reconnecting');
                updateStatus('Reconnecting...', 'connecting');
            });
        }
        
        // --- Servo Control ---

        function publishAngle(angle) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(mqttTopic, String(angle), { qos: 0 }, function(err) {
                    if (err) {
                        console.error('Publish error:', err);
                    } else {
                        console.log('Published angle:', angle);
                    }
                });
            } else {
                console.error('MQTT not connected');
            }
        }
        
        slider.addEventListener('input', function() {
            updateAngleDisplay(parseInt(this.value));
        });
        
        slider.addEventListener('change', function() {
            setAngle(parseInt(this.value));
        });
        
        function setAngle(angle) {
            console.log('Setting angle to:', angle);
            updateAngleDisplay(angle);
            publishAngle(angle);
        }
        
        // --- Start ---

        window.onload = function() {
            connectMQTT();
        };
        
        console.log('Page loaded successfully');
    </script>
</body>
</html>
